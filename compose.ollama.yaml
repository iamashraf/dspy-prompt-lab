# Local Ollama for the free setup. Start it with:
#   podman compose -f compose.ollama.yaml up -d      (or: docker compose ...)
#
# Models live in a named volume. To reuse an existing one, set its name in .env:
#   DSPY_LAB_OLLAMA_VOLUME=my-existing-ollama-volume
# Do not run two Ollama containers on the same volume at once: a model pull from each can corrupt it.
services:
  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      # Ollama has no authentication, so publish on localhost only.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the model, then exits. Safe to re-run.
  ollama-init:
    image: docker.io/ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL=${DSPY_LAB_MODEL:-llama3.1:8b}
    entrypoint: ["sh", "-c", "ollama pull $$MODEL"]

volumes:
  ollama_data:
    name: ${DSPY_LAB_OLLAMA_VOLUME:-dspy_lab_ollama}
